server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:auth-service}:8082
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://${USER_SERVICE_HOST:user-service}:8081
          predicates:
            - Path=/api/users/**

        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:order-service}:8083
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/payments/**

app:
  jwt:
    secret: ${JWT_SECRET}